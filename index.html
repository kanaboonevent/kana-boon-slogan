<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d88">
  <meta name="description" content="KANA-BOON 슬로건 이벤트 안내">
  <title>KANA-BOON 슬로건 이벤트 안내</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #101f48;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #153d88;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100svh;
      object-fit: contain;
    }
    @media (min-width: 700px) {
      body { padding: 24px; }
      main { min-height: 0; max-width: 1000px; }
      img { max-height: calc(100svh - 48px); width: auto; max-width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <img src="image.png" alt="KANA-BOON 슬로건 이벤트 안내">
  </main>
</body>
</html>
